[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=45", "wheel"]

[project]
name = "PySeismoSoil"
version = "0.6.3"
dependencies = [
  "PyWavelets>=1.3.0",
  "matplotlib>=2.0.0",
  "numba>=0.38.0",
  "numpy>=2.4.0",
  "scipy>=1.1.0",
]
requires-python = ">=3.11"
authors = [
  {name = "PySeismoSoil Contributors"},
]
classifiers = [
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3",
]
description = "A Python library for performing 1D seismic site response analysis"
license = {text = "BSD-3-Clause"}
readme = "README.md"

[project.urls]
Homepage = "https://caltech-geoquake.github.io/PySeismoSoil/"

[tool.format_docstring]
docstring_style = "numpy"
fix_rst_backticks = true
include_arg_defaults = true
include_arg_types = true
include_return_and_yield_types = true
line_length = 79

[tool.pydoclint]
check-arg-defaults = true
exclude = '\.git|.?venv|\.tox'
style = 'numpy'

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
exclude = ["tests*"]
include = ["PySeismoSoil*"]
