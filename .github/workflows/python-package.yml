---
# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions
name: Python package
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  lint:
    name: Lint (pydoclint, pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The pre-commit hook `check-notebooks-were-run` needs the PR's own
          # commit (not the merge commit that GitHub creates for the PR), and
          # the full git history to find the latest commit from main in it
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox
      - name: Run pydoclint and pre-commit
        run: tox -e pydoclint,pre-commit
  notebooks:
    # Runs every example notebook in a clean environment, without saving them.
    # The pre-commit hook `check-notebooks-were-run` (in the lint job above)
    # only checks that the notebooks were re-run during this PR, on the
    # contributor's own machine. This job also catches notebooks that fail:
    #   - because of code changes made after the notebooks were re-run
    #   - outside the contributor's machine (e.g., because of a package that is
    #     only installed locally, or a data file that was not committed)
    #   - with the latest versions of the dependencies, or with the latest
    #     `main` (CI runs this PR merged into `main`)
    name: Run example notebooks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox
      - name: Execute every notebook in examples/
        run: tox -e notebooks
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox tox-gh-actions
      - name: Test with tox
        run: tox
