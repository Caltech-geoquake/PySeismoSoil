[tox]
envlist =
    py311
    py312
    py313
    pydoclint
    pre-commit

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313

[testenv]
deps =
    pytest
commands =
    pytest --tb=long .

[testenv:notebooks]
deps =
    h5py
    nbmake
    pytest
commands =
    # Execute every example notebook, without modifying them. To re-run the
    # notebooks and save their outputs, use `tox -e run-notebooks`.
    pytest --nbmake --nbmake-timeout=600 {posargs} examples

[testenv:run-notebooks]
deps =
    h5py
    ipykernel
    nbclient
commands =
    # Re-run the example notebooks and save their outputs. Options are passed
    # to the script, e.g., `tox -e run-notebooks -- -j 4`.
    python scripts/run_notebooks.py {posargs}

[testenv:pydoclint]
deps =
    pydoclint
skip_install = true
commands =
    pydoclint PySeismoSoil

[testenv:pre-commit]
skip_install = true
deps =
    pre-commit
commands =
    # '--show-diff-on-failure' shows the changes that the hooks made (e.g., in
    # the CI log, where the modified files are discarded)
    pre-commit run -a --show-diff-on-failure
