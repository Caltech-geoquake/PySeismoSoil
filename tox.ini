[tox]
envlist =
    py311
    py312
    py313
    muff-format
    pydoclint
    pre-commit

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313

[testenv]
deps =
    pytest
commands =
    pytest --tb=long .

[testenv:notebooks]
deps =
    h5py
    nbmake
    pytest
commands =
    # Execute every example notebook, without modifying them. To re-run the
    # notebooks and save their outputs, use `tox -e run-notebooks`.
    pytest --nbmake --nbmake-timeout=600 {posargs} examples

[testenv:run-notebooks]
deps =
    h5py
    ipykernel
    nbclient
commands =
    # Re-run the example notebooks and save their outputs. Options are passed
    # to the script, e.g., `tox -e run-notebooks -- -j 4`.
    python scripts/run_notebooks.py {posargs}

[testenv:muff-format]
deps =
    muff==0.15.20
skip_install = true
commands =
    # use the '--diff' flag to avoid accidentally formatting code
    muff format --diff --config=muff.toml PySeismoSoil

[testenv:pydoclint]
deps =
    pydoclint
skip_install = true
commands =
    pydoclint PySeismoSoil

[testenv:pre-commit]
skip_install = true
deps =
    pre-commit
set_env =
    # Skipping auto-formatter here to avoid accidentally formatting code
    SKIP = muff-format
commands =
    pre-commit run -a
